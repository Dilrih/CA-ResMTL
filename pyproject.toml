[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-resmtl"
version = "0.1.0"
description = "CA-ResMTL residual multitask questionnaire modeling and intervention analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.6,<1.7",
  "torch>=2.6,<2.7",
  "openpyxl>=3.1,<4",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
trees = ["catboost>=1.2,<1.3", "lightgbm>=4.5,<4.6"]
dev = ["pytest>=7.4,<9", "ruff==0.17.0", "build>=1"]

[project.scripts]
ca-resmtl = "ca_resmtl.cli:main"
ca-resmtl-demo = "ca_resmtl.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs all three experiment stages on synthetic data"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
